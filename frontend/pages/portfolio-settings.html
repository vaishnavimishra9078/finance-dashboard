        <h2>Portfolio Settings</h2>


        <!-- SETTINGS CARD -->

        <div class="card">

            <h3>Currency Settings</h3>

            <p>
                Choose the currency you want to use
                throughout your portfolio.
            </p>


            <label for="currency">
                Select Currency:
            </label>


            <select id="currency">

                <option value="USD">
                    USD ($)
                </option>

                <option value="INR">
                    INR (₹)
                </option>

                <option value="EUR">
                    EUR (€)
                </option>

                <option value="GBP">
                    GBP (£)
                </option>

            </select>


            <br>
            <br>


            <button id="saveSettings">
                Save Settings
            </button>


            <p id="settingsMessage"></p>

        </div>
