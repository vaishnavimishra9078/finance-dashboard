<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Investment Simulator | Finance Dashboard</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
    <h1>Finance Dashboard</h1>

    <nav>
        <a href="../index.html">Dashboard</a>
        <a href="stock-analyzer.html">Stock Analyzer</a>
        <a href="market-intelligence.html">Market Intelligence</a>
        <a href="portfolio-manager.html">Portfolio Manager</a>
    </nav>
</header>


<main class="simulator-page">

    <section class="simulator-hero">

        <!-- ================= LEFT ================= -->

        <div class="simulator-content">

            <div class="simulator-badge">
                <span></span>
                Investment Intelligence
            </div>

            <h2 class="simulator-title">
                What if<br>
                you invested?
            </h2>

            <p class="simulator-description">
                Travel back in time and discover what your investment
                could be worth today. Enter a stock, investment amount
                and date to simulate the journey.
            </p>


            <!-- ================= FORM ================= -->

            <div class="simulator-form">

                <div class="simulator-input-grid">

                    <div class="simulator-field">
                        <label>Stock</label>

                        <input
                            type="text"
                            id="simTicker"
                            placeholder="AAPL"
                        >
                    </div>


                    <div class="simulator-field">
                        <label>Investment</label>

                        <input
                            type="number"
                            id="simAmount"
                            placeholder="₹10,000"
                        >
                    </div>


                    <div class="simulator-field">
                        <label>Investment Date</label>

                        <input
                            type="date"
                            id="simDate"
                        >
                    </div>

                </div>


                <button
                    id="simRunBtn"
                    class="simulator-button"
                >
                    Run Simulation →
                </button>

            </div>


            <p
                id="errorMsg"
                style="
                    color:var(--danger);
                    display:none;
                    margin-top:12px;
                "
            ></p>

        </div>


        <!-- ================= RIGHT 3D OBJECT ================= -->

        <div class="simulator-visual">

            <div class="investment-object">

                <div class="investment-ring"></div>

                <div class="investment-ring"></div>

                <div class="investment-ring"></div>


                <div class="investment-sphere"></div>


                <div class="floating-coin coin-a">
                    ₹
                </div>

                <div class="floating-coin coin-b">
                    $
                </div>

                <div class="floating-coin coin-c">
                    %
                </div>

            </div>

        </div>

    </section>

     
    <!-- ================= RESULT ================= -->

    <section    
        id="simResult"
        class="simulator-result"
    ></section>

</main>


<script src="../js/main.js"></script>

<script src="../js/simulator.js"></script>

</body>

</html>
